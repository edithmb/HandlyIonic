<ion-content [fullscreen]="true">
  
  <div id="mapId" class="map-container"></div>

  <div class="search-overlay">
    <div class="header-search">
      <ion-button fill="clear" routerLink="/home-client">
        <ion-icon name="arrow-back-outline"></ion-icon>
      </ion-button>
      <div class="search-box">
        <ion-icon name="search-outline"></ion-icon>
        <input type="text" [placeholder]="'Buscando: ' + professionName" readonly>
      </div>
    </div>
  </div>

  <div class="bottom-sheet">
    <div class="drag-handle"></div>
    <div class="scrollable-content">
      
      <p *ngIf="professionals.length === 0" style="text-align: center; color: #888; padding: 20px;">
        No hay profesionales disponibles en esta área.
      </p>

      <div class="prof-card" *ngFor="let prof of professionals">
        <div class="prof-avatar">
          <ion-icon name="person-circle-outline" style="font-size: 3rem; color: #ff7a45;"></ion-icon>
        </div>
        <div class="prof-info">
          <h3>{{ prof.nombre }}</h3>
          <p>Rubí, Barcelona ({{ prof.distancia }})</p>
          <div class="stars">
            <span style="color:#ff7a45">★★★★★</span>
          </div>
        </div>
        <button class="btn-perfil" routerLink="/professional-profile">Ver perfil</button>
      </div>

    </div>
  </div>
</ion-content>
