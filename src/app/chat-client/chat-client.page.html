<ion-header [translucent]="true" class="ion-no-border">
  <ion-toolbar color="light">
    <ion-title class="fuente-titulos">Mis Presupuestos</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true" class="bg-crema">
  
  <div *ngIf="loading" class="ion-text-center ion-padding">
    <ion-spinner name="crescent" color="primary"></ion-spinner>
    <p>Buscando presupuestos...</p>
  </div>

  <div *ngIf="!loading && tasks.length === 0" class="ion-text-center ion-padding empty-state">
    <ion-icon name="document-text-outline" style="font-size: 4rem; color: #ccc;"></ion-icon>
    <p>Aún no tienes presupuestos enviados.</p>
  </div>

  <ion-list lines="none" *ngIf="!loading && tasks.length > 0">
    <ion-item-sliding *ngFor="let item of tasks">
      <ion-item (click)="seeBudget(item.task_id)" class="item-presupuesto">
        
        <ion-avatar slot="start" [ngClass]="item.budget_id ? 'bg-naranja' : 'bg-gris'">
          <ion-icon name="wallet-outline" color="light"></ion-icon>
        </ion-avatar>

        <ion-label>
          <h2 class="titulo-tarea">{{ item.title }}</h2>
          <p class="profesional-name">{{ item.professional_name || 'Buscando profesional...' }}</p>
          
          <ion-badge [color]="item.budget_id ? 'primary' : 'medium'" mode="ios">
            {{ item.budget_id ? 'Presupuesto Recibido' : 'Pendiente de presupuesto' }}
          </ion-badge>
        </ion-label>

        <div slot="end" class="precio-container" *ngIf="item.agreed_price">
          <span class="precio">{{ item.agreed_price }}€</span>
          <ion-icon name="chevron-forward-outline" color="medium"></ion-icon>
        </div>
      </ion-item>
    </ion-item-sliding>
  </ion-list>

</ion-content>

<app-shared-menu></app-shared-menu>
