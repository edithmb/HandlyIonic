services:

  # ── Base de datos PostgreSQL ────────────────────────
  db:
    image: postgres:16
    container_name: handly_db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database_handly/handly.sql:/docker-entrypoint-initdb.d/handly.sql
    ports:
      - "5432:5432"
    networks:
      - handly_red
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Backend PHP ─────────────────────────────────────
  backend:
    build:
      context: ../Handly-Backend
      dockerfile: Dockerfile
    container_name: handly_backend
    restart: always
    #environment:
      #DB_HOST: db
      #DB_PORT: 5432
      #DB_USER: ${POSTGRES_USER}
      #DB_PASS: ${POSTGRES_PASSWORD}
      #DB_NAME: ${POSTGRES_DB}
    ports:
      - "80:80"
    volumes: 
      - ../Handly-Backend:/var/www/html 
    command: >
      bash -c "
      composer install &&
      if [ -z \"\$$(grep APP_KEY .env | cut -d '=' -f2)\" ]; then php artisan key:generate; fi &&
      apache2-foreground
      "
    depends_on:
      db:
        condition: service_healthy
    networks:
      - handly_red

  # ── App escritorio .NET ─────────────────────────────
  # desktop:
    # build:
    #   context: ../../HandlyEscritorio
    #   dockerfile: Dockerfile
    # container_name: handly_desktop
    # restart: always
    # environment:
    #   DB_HOST: db
    #   DB_PORT: 5432
    #   DB_USER: ${POSTGRES_USER}
    #   DB_PASS: ${POSTGRES_PASSWORD}
    #   DB_NAME: ${POSTGRES_DB}
    # ports:
    #   - "5000:5000"
    # depends_on:
    #   db:
    #     condition: service_healthy
    # networks:
    #   - handly_red

  # ── Frontend Ionic ──────────────────────────────────
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: handly_frontend
    restart: always
    ports:
      - "8100:8100"
    volumes:
      - ./src:/app/src
    depends_on:
      - backend
    networks:
      - handly_red

networks:
  handly_red:
    driver: bridge

volumes:
  postgres_data: